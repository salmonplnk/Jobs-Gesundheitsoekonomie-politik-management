name: Review and correct the fresh public job feed once

on:
  push:
    branches:
      - codex/feed-review-20260924

permissions:
  contents: read

concurrency:
  group: public-job-feed
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/feed-review-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the explicitly selected review commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require and load the existing public feed
        id: previous
        env:
          EXPECTED_PREVIOUS_COMMIT: c90b503d7ea7c7ba6921d99b941b5ec349b95e3d
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/job-feed-data:refs/remotes/origin/job-feed-data
          previous_commit=$(git rev-parse refs/remotes/origin/job-feed-data)
          if [ "$previous_commit" != "$EXPECTED_PREVIOUS_COMMIT" ]; then
            echo "The public data branch changed; this one-off correction requires review of the new snapshot." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/job-feed-review-previous"
          git archive "$previous_commit" data/job-feed | tar -x -C "$RUNNER_TEMP/job-feed-review-previous"
          test -s "$RUNNER_TEMP/job-feed-review-previous/data/job-feed/index.json"
          test ! -e data/job-feed
          echo "commit=$previous_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install the public PDF text reader
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run regression tests
        run: npm test

      - name: Install Chromium for required browser checks
        run: npx playwright install --with-deps chromium

      - name: Check the browser with fresh fixtures before reviewing the snapshot
        shell: bash
        run: |
          set -euo pipefail
          node scripts/browser-smoke.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('browser-smoke/report.json', 'utf8'));
          assert.equal(report.dataset, 'fixture');
          assert.equal(report.status, 'passed');
          assert.deepEqual(report.errors, []);
          NODE
          cp browser-smoke/report.json browser-smoke/fixture-report.json

      - name: Download and verify the immutable completed crawl artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const repository = 'salmonplnk/Jobs-Gesundheitsoekonomie-politik-management';
          const runId = 35972131067;
          const artifactId = 10796853002;
          const expectedCommit = 'd9ae38369cca961cbe795bef324f2475ff8fa4d7';
          const expectedName = 'public-job-feed-focus-35972131067';
          const expectedDigest = 'db08142bd8e978bfc87a5310d462d5db2ebec7cc49f4a218a181892d47e149e7';
          const api = `https://api.github.com/repos/${repository}`;
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const request = async path => {
            const response = await fetch(`${api}${path}`, { headers, redirect: 'error', signal: AbortSignal.timeout(30000) });
            assert.ok(response.ok, `GitHub metadata request failed (${response.status}).`);
            return response.json();
          };
          const [run, artifact, jobs] = await Promise.all([
            request(`/actions/runs/${runId}`),
            request(`/actions/artifacts/${artifactId}`),
            request(`/actions/runs/${runId}/attempts/1/jobs?per_page=100`),
          ]);
          assert.equal(run.head_sha, expectedCommit);
          assert.equal(run.path, '.github/workflows/job-feed-focus.yml');
          assert.equal(run.head_branch, 'codex/feed-focus-20260924');
          assert.equal(run.event, 'push');
          assert.equal(run.status, 'completed');
          assert.equal(run.conclusion, 'success');
          assert.equal(run.repository.full_name, repository);
          assert.equal(artifact.id, artifactId);
          assert.equal(artifact.name, expectedName);
          assert.equal(artifact.expired, false);
          assert.equal(artifact.workflow_run.id, runId);
          assert.equal(artifact.workflow_run.head_sha, expectedCommit);
          assert.equal(artifact.digest, `sha256:${expectedDigest}`);
          const age = Date.now() - Date.parse(artifact.created_at);
          assert.ok(age >= -300000 && age <= 48 * 60 * 60 * 1000, 'The pinned artifact must be at most 48 hours old.');
          const maximumArchiveBytes = 32 * 1024 * 1024;
          assert.ok(artifact.size_in_bytes > 0 && artifact.size_in_bytes <= maximumArchiveBytes);
          assert.equal(jobs.total_count, 1);
          const job = jobs.jobs[0];
          assert.equal(job.name, 'focus');
          assert.equal(job.head_sha, expectedCommit);
          assert.equal(job.status, 'completed');
          assert.equal(job.conclusion, 'success');
          for (const name of ['Run regression tests', 'Check the browser with fixtures before the full crawl', 'Scrape all 85 public sources with the current adapters and subject filter', 'Validate source inventory, relevance, counts and linked full texts', 'Check the website with the newly scraped focused feed in Chromium', 'Require successful browser evidence using the real focused feed', 'Upload public feed and browser evidence', 'Publish only the validated public data as a non-forced update']) {
            assert.equal(job.steps.find(step => step.name === name)?.conclusion, 'success', `Required source step did not succeed: ${name}`);
          }
          assert.deepEqual(job.steps.filter(step => step.conclusion === 'failure').map(step => step.name), []);
          let response = await fetch(`${api}/actions/artifacts/${artifactId}/zip`, { headers, redirect: 'manual', signal: AbortSignal.timeout(30000) });
          for (let redirects = 0; [301, 302, 303, 307, 308].includes(response.status); redirects++) {
            assert.ok(redirects < 5, 'Too many artifact download redirects.');
            const target = new URL(response.headers.get('location') || '', response.url);
            assert.equal(target.protocol, 'https:');
            assert.equal(target.username, '');
            assert.equal(target.password, '');
            // Signed storage redirects receive no GitHub credentials or other headers.
            response = await fetch(target, { redirect: 'manual', signal: AbortSignal.timeout(120000) });
          }
          assert.ok(response.ok, `Artifact download failed (${response.status}).`);
          const chunks = [];
          let size = 0;
          for await (const chunk of response.body) {
            size += chunk.byteLength;
            assert.ok(size <= maximumArchiveBytes, 'Artifact archive exceeds the download budget.');
            chunks.push(chunk);
          }
          assert.equal(size, artifact.size_in_bytes);
          const archive = Buffer.concat(chunks);
          assert.equal(createHash('sha256').update(archive).digest('hex'), expectedDigest, 'Artifact archive SHA-256 mismatch.');
          await writeFile(join(process.env.RUNNER_TEMP, 'job-feed-review-verified.zip'), archive, { mode: 0o600 });
          console.log(`Verified immutable artifact ${artifactId} from run ${runId}; only its public JSON files will be reused.`);
          NODE

      - name: Extract only the verified public snapshot files
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import stat
          import zipfile
          archive = Path(os.environ['RUNNER_TEMP']) / 'job-feed-review-verified.zip'
          with zipfile.ZipFile(archive) as source:
              entries = source.infolist()
              assert len(entries) <= 120, 'Unexpected archive entry count.'
              assert len({entry.filename for entry in entries}) == len(entries), 'Duplicate archive paths.'
              assert sum(entry.file_size for entry in entries) <= 128 * 1024 * 1024, 'Archive exceeds uncompressed budget.'
              snapshots = []
              for entry in entries:
                  name = entry.filename
                  assert not entry.flag_bits & 1, 'Encrypted archive entry.'
                  kind = stat.S_IFMT(entry.external_attr >> 16)
                  assert kind in (0, stat.S_IFREG, stat.S_IFDIR), 'Non-regular archive entry.'
                  if entry.is_dir():
                      assert name in ('data/', 'data/job-feed/', 'browser-smoke/'), 'Unexpected archive directory.'
                      continue
                  if re.fullmatch(r'browser-smoke/(?:[a-zA-Z0-9_-]+\.png|(?:fixture-)?report\.json)', name):
                      continue  # Never reuse prior browser screenshots or reports as evidence for this review.
                  assert re.fullmatch(r'data/job-feed/[a-z0-9_-]+\.json', name), 'Unexpected archive path.'
                  limit = (24 if name.endswith('/index.json') else 12) * 1024 * 1024
                  assert 0 < entry.file_size <= limit, 'Feed file exceeds its byte limit.'
                  snapshots.append(entry)
              assert len(snapshots) == 86, 'Expected the index plus all 85 source snapshots.'
              assert sum(entry.file_size for entry in snapshots) <= 64 * 1024 * 1024, 'Feed exceeds total byte budget.'
              output = Path('data/job-feed')
              output.mkdir(parents=True, exist_ok=False)
              for entry in snapshots:
                  content = source.read(entry)
                  assert len(content) == entry.file_size, 'Archive entry size mismatch.'
                  (output / Path(entry.filename).name).write_bytes(content)
          print('Extracted only the index and 85 verified public source snapshots.')
          PY

      - name: Confirm artifact snapshots match the pinned published data
        shell: bash
        run: |
          set -euo pipefail
          git diff --no-index --exit-code -- "$RUNNER_TEMP/job-feed-review-previous/data/job-feed" data/job-feed
          cp data/job-feed/index.json "$RUNNER_TEMP/job-feed-review-source-index.json"

      # This is a bounded reclassification of the successful fresh crawl. Source
      # check timestamps remain those of the original crawl; no new scrape is claimed.
      - name: Review the immutable public snapshot with the corrected subject policy
        run: node scripts/review-job-feed.mjs

      - name: Validate source inventory, relevance, counts and linked full texts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, readdir, stat, appendFile } from 'node:fs/promises';
          import { catalogOrganizations, compactIndexJobs, FEED_BYTE_LIMITS } from './scripts/job-feed.mjs';
          import Relevance from './js/job-relevance.js';
          const json = async path => JSON.parse(await readFile(path, 'utf8'));
          const organizations = catalogOrganizations(await json('data/organizations.json'), await json('data/job-source-overrides.json'));
          const byId = new Map(organizations.map(org => [org.id, org]));
          const ids = [...byId.keys()].sort();
          assert.equal(ids.length, 85, 'This correction must check the entire 85-source catalog.');
          const directory = 'data/job-feed';
          assert.deepEqual((await readdir(directory)).sort(), [...ids.map(id => `${id}.json`), 'index.json'].sort());
          const index = await json(`${directory}/index.json`);
          assert.equal(index.version, 1);
          assert.equal(Relevance.POLICY_VERSION, 1);
          assert.equal(index.scope?.policy_version, Relevance.POLICY_VERSION);
          assert.deepEqual(index.sources.map(source => source.org_id).sort(), ids);
          assert.equal(index.run.checked_sources, ids.length);
          assert.equal(index.run.total_sources, ids.length);
          assert.equal(index.run.limited, false);
          assert.equal(index.run.browser, 'enabled');
          const started = Date.parse(index.run.started_at), finished = Date.parse(index.run.finished_at);
          assert.ok(Number.isFinite(started) && Number.isFinite(finished) && started <= finished);
          const original = await json(`${process.env.RUNNER_TEMP}/job-feed-review-source-index.json`);
          assert.deepEqual({ ...index.run, counts: original.run.counts }, original.run, 'Review must preserve the original crawl identity and times.');
          assert.equal(index.review?.source_run_id, 35972131067);
          assert.equal(index.review?.source_commit, 'c90b503d7ea7c7ba6921d99b941b5ec349b95e3d');
          assert.ok(Array.isArray(index.review.removed_job_ids));
          const originalIds = new Set(original.jobs.map(job => job.id));
          const currentIds = new Set(index.jobs.map(job => job.id));
          assert.ok(index.jobs.every(job => originalIds.has(job.id)), 'A bounded snapshot review must not add unseen vacancies.');
          assert.deepEqual([...index.review.removed_job_ids].sort(), [...originalIds].filter(id => !currentIds.has(id)).sort());
          const age = Date.now() - finished;
          assert.ok(age >= -300000 && age <= 48 * 60 * 60 * 1000, 'Review requires the immutable crawl to be at most 48 hours old.');
          const published = Date.parse(index.generated_at), publicationAge = Date.now() - published;
          assert.ok(Number.isFinite(published) && published >= finished && publicationAge >= -300000 && publicationAge <= 60 * 60 * 1000, 'The review publication time must be fresh, distinct from the original crawl time.');
          assert.ok(index.jobs.length > 0, 'Do not replace the public feed with an empty result.');
          assert.ok((await stat(`${directory}/index.json`)).size <= FEED_BYTE_LIMITS.index);
          const statuses = ['ok', 'empty', 'partial', 'unsupported', 'error'];
          const sourceCounts = Object.fromEntries([...statuses, 'pending'].map(status => [status, 0]));
          const shards = [];
          const nonNegativeInteger = (value, label) => assert.ok(Number.isSafeInteger(value) && value >= 0, label);
          for (const source of index.sources) {
            assert.ok(statuses.includes(source.status), `Unchecked source: ${source.org_id}`);
            sourceCounts[source.status]++;
            const checked = Date.parse(source.checked_at);
            assert.ok(checked >= started && checked <= finished, `Source was not checked in the original crawl: ${source.org_id}`);
            const originalSource = original.sources.find(item => item.org_id === source.org_id);
            assert.ok(originalSource);
            assert.equal(source.checked_at, originalSource.checked_at, 'Review must not claim a new source check.');
            assert.equal(source.raw_job_count, originalSource.raw_job_count, 'Review preserves the raw crawl count.');
            const file = `${directory}/${source.org_id}.json`;
            assert.ok((await stat(file)).size <= FEED_BYTE_LIMITS.shard);
            const shard = await json(file);
            assert.equal(shard.version, 1);
            assert.equal(shard.org_id, source.org_id);
            assert.deepEqual(shard.source, source);
            assert.equal(new Set(shard.jobs.map(job => job.id)).size, shard.jobs.length);
            const open = shard.jobs.filter(job => job.status !== 'closed');
            for (const field of ['job_count', 'raw_job_count', 'relevant_job_count', 'filtered_out_count', 'retained_count', 'scraped_count']) {
              nonNegativeInteger(source[field], `Invalid ${field}: ${source.org_id}`);
            }
            assert.equal(source.job_count, open.length);
            assert.equal(source.relevant_job_count, open.length);
            assert.equal(source.raw_job_count, source.relevant_job_count + source.filtered_out_count);
            assert.ok(source.raw_job_count >= source.scraped_count);
            assert.equal(source.retained_count, open.filter(job => job.last_seen !== source.checked_at).length);
            assert.equal(source.cached, source.retained_count > 0);
            for (const job of shard.jobs) {
              assert.equal(job.org_id, source.org_id);
              assert.ok(job.id.startsWith(`${source.org_id}:`));
              assert.ok(typeof job.description === 'string' && job.description.trim().length > 0);
              const classified = Relevance.classify(job, byId.get(source.org_id));
              assert.equal(classified.eligible, true, `Off-topic full job: ${job.id}`);
              assert.deepEqual(job.relevance, classified, `Classification mismatch: ${job.id}`);
            }
            shards.push(shard);
          }
          assert.deepEqual(index.run.counts, sourceCounts);
          // This rebuild checks every compact field, source link, category and
          // explanation against its full text, including cross-source URL deduplication.
          assert.deepEqual(index.jobs, compactIndexJobs(shards));
          assert.equal(new Set(index.jobs.map(job => job.url)).size, index.jobs.length);
          for (const field of ['scanned_jobs', 'relevant_jobs', 'excluded_jobs', 'retained_jobs']) {
            nonNegativeInteger(index.scope[field], `Invalid scope counter: ${field}`);
          }
          assert.equal(index.scope.scanned_jobs, original.scope.scanned_jobs, 'No additional source crawl was performed.');
          assert.equal(index.scope.relevant_jobs, index.jobs.length);
          assert.equal(index.scope.excluded_jobs, original.scope.excluded_jobs + index.review.removed_job_ids.length);
          assert.equal(index.scope.scanned_jobs, index.scope.relevant_jobs + index.scope.excluded_jobs);
          assert.ok(index.scope.scanned_jobs <= index.sources.reduce((total, source) => total + source.raw_job_count, 0));
          assert.equal(index.scope.retained_jobs, index.jobs.filter(job => job.last_seen !== shards.find(shard => shard.org_id === job.org_id).source.checked_at).length);
          const summary = `Validated ${index.jobs.length} relevant vacancies, ${index.scope.excluded_jobs} excluded vacancies and all ${ids.length} checked sources. Source statuses: ${JSON.stringify(sourceCounts)}.\n`;
          console.log(summary);
          await appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Check the website with the reviewed focused feed in Chromium
        run: node scripts/browser-smoke.mjs --require-feed

      - name: Require successful browser evidence using the real focused feed
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('browser-smoke/report.json', 'utf8'));
          const index = JSON.parse(await readFile('data/job-feed/index.json', 'utf8'));
          assert.equal(report.dataset, 'live');
          assert.equal(report.status, 'passed');
          assert.equal(report.jobs, index.jobs.length);
          assert.equal(report.sources, index.sources.length);
          assert.equal(report.generated_at, index.generated_at);
          assert.deepEqual(report.errors, []);
          NODE

      - name: Upload public feed and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-job-feed-review-${{ github.run_id }}
          path: |
            data/job-feed/*.json
            browser-smoke/*.png
            browser-smoke/report.json
            browser-smoke/fixture-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish only the validated public data as a non-forced update
        if: success()
        env:
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREVIOUS_COMMIT"
          remote_commit=$(git ls-remote --exit-code --heads origin refs/heads/job-feed-data | cut -f1)
          if [ "$remote_commit" != "$PREVIOUS_COMMIT" ]; then
            echo "The public data branch changed during validation; refusing to replace it." >&2
            exit 1
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/job-feed-review-publish-index"
          git read-tree --empty
          git add --force -- data/job-feed
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p "$PREVIOUS_COMMIT" -m "Correct relevance and source coverage in the reviewed public job feed")
          git push origin "$commit:refs/heads/job-feed-data"
          echo "Published the reviewed public data after immutable-artifact verification, regression, relevance and fresh Chromium validation. Original source check timestamps were preserved. The application release remains separate." >> "$GITHUB_STEP_SUMMARY"
