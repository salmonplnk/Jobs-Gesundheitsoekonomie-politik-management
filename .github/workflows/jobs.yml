name: Validate health jobs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Check browser JavaScript syntax
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
      - name: Validate organisation catalogue
        run: node -e "JSON.parse(require('node:fs').readFileSync('data/organizations.json', 'utf8'))"
      - name: Run regression tests
        run: node --test tests/*.test.*
