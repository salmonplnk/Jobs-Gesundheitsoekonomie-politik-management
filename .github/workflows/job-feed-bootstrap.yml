name: Bootstrap public job feed once

on:
  push:
    branches:
      - codex/job-feed-bootstrap-20260924

permissions:
  contents: read

concurrency:
  group: public-job-feed
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/job-feed-bootstrap-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out the explicitly selected bootstrap commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require an unpublished data branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin refs/heads/job-feed-data > "$RUNNER_TEMP/job-feed-bootstrap-remote"; then
            echo "job-feed-data already exists; this one-off bootstrap cannot replace it." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Could not inspect job-feed-data (exit $status)." >&2
              exit "$status"
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run regression tests
        run: npm test

      - name: Install Chromium for required browser checks
        run: npx playwright install --with-deps chromium

      - name: Check the browser test before the full crawl
        run: node scripts/browser-smoke.mjs

      - name: Scrape all public job sources with the current code
        run: npm run feed:refresh -- --browser --output data/job-feed

      - name: Validate complete source inventory and public snapshot files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, readdir, stat } from 'node:fs/promises';
          import { catalogOrganizations, FEED_BYTE_LIMITS } from './scripts/job-feed.mjs';
          const json = async path => JSON.parse(await readFile(path, 'utf8'));
          const organizations = catalogOrganizations(await json('data/organizations.json'), await json('data/job-source-overrides.json'));
          const ids = organizations.map(org => org.id).sort();
          assert.equal(ids.length, 85, 'Bootstrap must include all 85 catalog sources.');
          const directory = 'data/job-feed';
          assert.deepEqual((await readdir(directory)).sort(), [...ids.map(id => `${id}.json`), 'index.json'].sort());
          const index = await json(`${directory}/index.json`);
          assert.equal(index.version, 1);
          assert.deepEqual(index.sources.map(source => source.org_id).sort(), ids);
          assert.equal(index.run.checked_sources, ids.length);
          assert.equal(index.run.total_sources, ids.length);
          assert.equal(index.run.limited, false);
          assert.equal(index.run.browser, 'enabled');
          assert.ok(index.jobs.length > 0, 'Do not publish an empty first feed.');
          assert.ok((await stat(`${directory}/index.json`)).size <= FEED_BYTE_LIMITS.index);
          const allowedStatuses = new Set(['ok', 'empty', 'partial', 'unsupported', 'error']);
          const shards = new Map();
          for (const source of index.sources) {
            assert.ok(allowedStatuses.has(source.status), `Unchecked source: ${source.org_id}`);
            assert.ok(Number.isFinite(Date.parse(source.checked_at)), `Missing check date: ${source.org_id}`);
            const path = `${directory}/${source.org_id}.json`;
            assert.ok((await stat(path)).size <= FEED_BYTE_LIMITS.shard);
            const shard = await json(path);
            assert.equal(shard.version, 1);
            assert.equal(shard.org_id, source.org_id);
            assert.deepEqual(shard.source, source);
            assert.equal(shard.jobs.filter(job => job.status !== 'closed').length, source.job_count);
            shards.set(source.org_id, new Map(shard.jobs.map(job => [job.id, job])));
          }
          assert.equal(new Set(index.jobs.map(job => job.url)).size, index.jobs.length);
          for (const job of index.jobs) {
            const full = shards.get(job.org_id)?.get(job.id);
            assert.ok(full, `Missing full job: ${job.id}`);
            assert.equal(full.url, job.url);
            assert.equal(job.detail_file, `./${job.org_id}.json`);
            assert.equal(full.status, 'open');
          }
          console.log(`Validated ${index.jobs.length} jobs and all ${ids.length} source snapshots.`);
          NODE

      - name: Check the website with the generated public feed in Chromium
        run: node scripts/browser-smoke.mjs --require-feed

      - name: Require successful browser evidence using the real feed
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('browser-smoke/report.json', 'utf8'));
          const index = JSON.parse(await readFile('data/job-feed/index.json', 'utf8'));
          assert.equal(report.dataset, 'live', 'Bootstrap requires the freshly scraped feed, not fixtures.');
          assert.equal(report.status, 'passed');
          assert.equal(report.jobs, index.jobs.length);
          assert.equal(report.sources, index.sources.length);
          assert.equal(report.generated_at, index.generated_at);
          assert.deepEqual(report.errors, []);
          NODE

      - name: Upload public feed and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-job-feed-bootstrap-${{ github.run_id }}
          path: |
            data/job-feed/*.json
            browser-smoke/*.png
            browser-smoke/report.json
          retention-days: 14

      - name: Publish the first public snapshots without application code
        if: success()
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$RUNNER_TEMP/job-feed-bootstrap-index"
          git read-tree --empty
          git add --force -- data/job-feed
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "Bootstrap public job feed after source and browser checks")
          if git ls-remote --exit-code --heads origin refs/heads/job-feed-data > "$RUNNER_TEMP/job-feed-bootstrap-remote"; then
            echo "job-feed-data appeared during the run; refusing to replace it." >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Could not verify job-feed-data is still absent (exit $status)." >&2
              exit "$status"
            fi
          fi
          git push origin "$commit:refs/heads/job-feed-data"
          echo "Published the first public feed to job-feed-data after regression, inventory and Chromium checks. Application branches were not changed." >> "$GITHUB_STEP_SUMMARY"
